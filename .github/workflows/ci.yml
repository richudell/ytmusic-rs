name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # --locked throughout: a drifting rmcp-macros resolution should fail
      # here rather than silently build against a version-skewed macro crate.
      # See the pin comment in Cargo.toml.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      # Read into env because the `secrets` context is not available in a
      # step-level `if:`. Lets the upload step skip cleanly when the secret
      # hasn't been configured yet.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Collect once with --no-report, then render each format from the same
      # profile data. Rendering in a single combined invocation would discard
      # the raw data before the second format could be produced.
      - name: Collect coverage
        run: cargo llvm-cov --all-features --workspace --locked --no-report

      - name: Render Cobertura report
        run: cargo llvm-cov report --cobertura --output-path cobertura.xml

      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-coverage
          path: cobertura.xml
          if-no-files-found: error

      # Skipped until the CODECOV_TOKEN repository secret exists, so CI stays
      # green in the meantime and the Cobertura artifact is still produced.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cobertura.xml
          fail_ci_if_error: true
